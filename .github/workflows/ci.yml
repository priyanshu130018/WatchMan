name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      APP_NAME: "WatchMan API"
      APP_ENV: "test"
      APP_DEBUG: "false"
      APP_VERSION: "1.0.0"
      HOST: "0.0.0.0"
      PORT: "8000"
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "watchman_test"
      POSTGRES_USER: "watchman"
      POSTGRES_PASSWORD: "ci_test_password"
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "ci_testing_secret_key_minimum_thirty_two_characters_long"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      TMDB_API_KEY: "ci_test_tmdb_api_key_000000000000"
      TMDB_BASE_URL: "https://api.themoviedb.org/3"
      OMDB_API_KEY: "ci_test_omdb_api_key"
      OMDB_BASE_URL: "https://www.omdbapi.com/"
      REDIS_URL: "redis://localhost:6379/0"
      CELERY_BROKER_URL: "redis://localhost:6379/1"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
      SUPABASE_URL: "https://ci-test.supabase.co"
      SUPABASE_ANON_KEY: "ci_anon_key"
      SUPABASE_SERVICE_ROLE_KEY: "ci_service_role_key"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8000"
      ENABLE_PGVECTOR: "false"
      EMBEDDING_MODEL: "all-MiniLM-L6-v2"
      VECTOR_DIMENSION: "384"
      ML_ADMIN_EMAILS: "admin@watchman.local"
      HF_API_URL: "https://api-inference.huggingface.co/pipeline/feature-extraction"
      HF_API_TOKEN: "ci_test_hf_token"
      FRONTEND_URL: "http://localhost:3000"
      INITIAL_POPULAR_MOVIE_EMBED_LIMIT: "500"
      INITIAL_POPULAR_TV_EMBED_LIMIT: "500"
      ENABLE_INTERACTION_EMBEDDING: "true"
      ENABLE_SEARCH_EMBEDDING: "false"
      SEARCH_EMBED_THRESHOLD: "3"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest
        working-directory: ./backend
        run: pytest

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: "http://localhost:8000/api"
      VITE_SUPABASE_URL: "https://ci-test.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "ci_publishable_key"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build Application
        working-directory: ./frontend
        run: npm run build

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Build
        run: docker compose build
