version: '3.8'

services:
  # PostgreSQL database with pgvector support
  postgres:
    image: pgvector/pgvector:pg15-latest
    container_name: watchman_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchman_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - watchman_network

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: watchman_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - watchman_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: watchman_backend
    environment:
      # App config
      APP_NAME: WatchMan
      APP_ENV: development
      APP_DEBUG: "true"
      APP_VERSION: 1.0.0
      HOST: 0.0.0.0
      PORT: 8000

      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-watchman_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      # Security
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 30

      # TMDB
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_BASE_URL: https://api.themoviedb.org/3
      TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p/original

      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # Supabase (optional)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # CORS
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:80

      # ML/Embeddings
      ENABLE_PGVECTOR: "true"
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      VECTOR_DIMENSION: 384

      # Frontend
      FRONTEND_URL: http://localhost:5173

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - watchman_network
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: watchman_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - watchman_network
    environment:
      VITE_API_BASE_URL: http://backend:8000/api
    # For development with hot reload, uncomment below and comment out the build section above
    # image: node:20-alpine
    # working_dir: /app
    # volumes:
    #   - ./frontend:/app
    # command: npm run dev -- --host 0.0.0.0
    # ports:
    #   - "5173:5173"

  # Celery Worker (optional - for background tasks)
  # celery_worker:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #   container_name: watchman_celery_worker
  #   environment:
  #     # Same as backend service
  #   depends_on:
  #     - postgres
  #     - redis
  #   volumes:
  #     - ./backend:/app
  #   networks:
  #     - watchman_network
  #   command: celery -A app.tasks worker -l info

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  watchman_network:
    driver: bridge
