# =============================================================================
# WatchMan — Render Blueprint Specification
# =============================================================================
# Deploys the 3 backend runtime services on Render:
#   1. watchman-api     : FastAPI Web Service (Liveness on /health)
#   2. watchman-worker  : Celery background worker (ML & catalog sync)
#   3. watchman-beat    : Celery periodic scheduler
#
# Connects to managed cloud dependencies:
#   - Database: Supabase PostgreSQL (+pgvector)
#   - Redis   : Upstash Redis (TLS rediss://)
#   - Auth    : Supabase Auth
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Web API Service
  # ---------------------------------------------------------------------------
  - type: web
    name: watchman-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: WatchMan
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_VERSION
        value: 1.0.0
      - key: HOST
        value: "0.0.0.0"
      - key: AUTH_PROVIDER
        value: supabase
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_BASE_URL
        value: https://api.themoviedb.org/3
      - key: OMDB_API_KEY
        sync: false
      - key: OMDB_BASE_URL
        value: https://www.omdbapi.com/
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: VECTOR_DIMENSION
        value: "384"
      - key: ENABLE_PGVECTOR
        value: "true"
      - key: ML_ADMIN_EMAILS
        sync: false
      - key: HF_API_URL
        value: https://router.huggingface.co/hf-inference/models
      - key: HF_API_TOKEN
        sync: false
      - key: INITIAL_POPULAR_MOVIE_EMBED_LIMIT
        value: "500"
      - key: INITIAL_POPULAR_TV_EMBED_LIMIT
        value: "500"
      - key: ENABLE_INTERACTION_EMBEDDING
        value: "true"
      - key: ENABLE_SEARCH_EMBEDDING
        value: "false"
      - key: SEARCH_EMBED_THRESHOLD
        value: "3"

  # ---------------------------------------------------------------------------
  # 2. Celery Background Worker
  # ---------------------------------------------------------------------------
  - type: worker
    name: watchman-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: celery -A app.core.celery.celery_app worker --loglevel=info
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: WatchMan
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: AUTH_PROVIDER
        value: supabase
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_BASE_URL
        value: https://api.themoviedb.org/3
      - key: OMDB_API_KEY
        sync: false
      - key: OMDB_BASE_URL
        value: https://www.omdbapi.com/
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: VECTOR_DIMENSION
        value: "384"
      - key: ENABLE_PGVECTOR
        value: "true"
      - key: ML_ADMIN_EMAILS
        sync: false
      - key: HF_API_URL
        value: https://router.huggingface.co/hf-inference/models
      - key: HF_API_TOKEN
        sync: false
      - key: INITIAL_POPULAR_MOVIE_EMBED_LIMIT
        value: "500"
      - key: INITIAL_POPULAR_TV_EMBED_LIMIT
        value: "500"
      - key: ENABLE_INTERACTION_EMBEDDING
        value: "true"
      - key: ENABLE_SEARCH_EMBEDDING
        value: "false"
      - key: SEARCH_EMBED_THRESHOLD
        value: "3"

  # ---------------------------------------------------------------------------
  # 3. Celery Periodic Beat Scheduler
  # ---------------------------------------------------------------------------
  - type: worker
    name: watchman-beat
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: celery -A app.core.celery.celery_app beat --loglevel=info
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: WatchMan
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: AUTH_PROVIDER
        value: supabase
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_BASE_URL
        value: https://api.themoviedb.org/3
      - key: OMDB_API_KEY
        sync: false
      - key: OMDB_BASE_URL
        value: https://www.omdbapi.com/
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: VECTOR_DIMENSION
        value: "384"
      - key: ENABLE_PGVECTOR
        value: "true"
      - key: ML_ADMIN_EMAILS
        sync: false
      - key: HF_API_URL
        value: https://router.huggingface.co/hf-inference/models
      - key: HF_API_TOKEN
        sync: false
      - key: INITIAL_POPULAR_MOVIE_EMBED_LIMIT
        value: "500"
      - key: INITIAL_POPULAR_TV_EMBED_LIMIT
        value: "500"
      - key: ENABLE_INTERACTION_EMBEDDING
        value: "true"
      - key: ENABLE_SEARCH_EMBEDDING
        value: "false"
      - key: SEARCH_EMBED_THRESHOLD
        value: "3"
