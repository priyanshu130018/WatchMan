# =============================================================================
# WatchMan — single Compose file (containers on your machine -> CLOUD services)
# =============================================================================
# Runs the whole app as containers pointed at your managed third-party services:
#   * Database   : Supabase PostgreSQL (+pgvector)  -> DATABASE_URL   (root .env)
#   * Redis      : Upstash Redis (TLS, rediss://)   -> REDIS_URL/CELERY_* (root .env)
#   * Auth       : Supabase Auth                     -> AUTH_PROVIDER=supabase
#   * Embeddings : HuggingFace Inference API         -> HF_API_URL/HF_API_TOKEN
#
# There are deliberately NO postgres/redis containers — cloud only. The backend
# fail-fast config (APP_ENV=production) rejects any localhost/Docker DB/Redis URL.
#
# ALL runtime config lives in ONE root-level file next to this compose.yml:
#   .env   (copy from .env.example, then fill in your values)
# Docker Compose auto-loads that root .env, so it serves both roles:
#   * backend / celery_worker / content_based_worker / als_worker / celery_beat  <- env_file: ./.env
#   * frontend build  <- ${VITE_*} build-arg interpolation from the same .env
# No `--env-file` flag is ever needed.
#
# This file is named compose.yml, so Docker finds it automatically (no -f needed):
#   docker compose up --build            # build + start the whole stack
#   docker compose run --rm backend alembic upgrade head   # run DB migrations
#   docker compose logs -f backend
#   docker compose down                  # stop everything
#
# Reach it at:  backend http://localhost:8000  |  frontend http://localhost:3000

services:
  # FastAPI backend -> Supabase Postgres + Upstash Redis
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchman_backend
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; exit(0 if urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # Celery general worker -> Upstash Redis broker/backend (default queue: catalog, cleanup, etc.)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchman_celery_worker
    command: celery -A app.core.celery.celery_app worker -Q default,celery --loglevel=info -n celery_worker@%h
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery.celery_app inspect ping --timeout 10"]
      interval: 30s
      timeout: 20s
      start_period: 45s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Dedicated Celery worker for Content-Based recommendation workload (content_based queue ONLY)
  content_based_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchman_content_based_worker
    command: celery -A app.core.celery.celery_app worker -Q content_based -c 2 --loglevel=info -n content_based_worker@%h
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery.celery_app inspect ping --timeout 10"]
      interval: 30s
      timeout: 20s
      start_period: 45s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Dedicated Celery worker for ALS Collaborative-Filtering workload (als queue ONLY)
  als_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchman_als_worker
    command: celery -A app.core.celery.celery_app worker -Q als -c 2 --loglevel=info -n als_worker@%h
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery.celery_app inspect ping --timeout 10"]
      interval: 30s
      timeout: 20s
      start_period: 45s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Celery beat scheduler -> Upstash Redis broker/backend
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchman_celery_beat
    command: celery -A app.core.celery.celery_app beat --loglevel=info
    env_file:
      - ./.env
    # Beat has no broker mailbox to ping and exposes no HTTP endpoint, so we just
    # verify the scheduler process is alive by scanning /proc for a 'beat'
    # command line (pure Python — no procps/pgrep needed in the slim image).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import glob,sys; sys.exit(0 if any(b'beat' in open(f,'rb').read() for f in glob.glob('/proc/[0-9]*/cmdline')) else 1)\""]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (Nitro SSR). VITE_* are baked at BUILD time from the root .env,
  # supplied here as build args via ${VITE_*} interpolation (Compose auto-loads
  # ./.env — no --env-file needed).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-local}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    container_name: watchman_frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Dev-only test runner. Gated behind the `test` profile so it NEVER starts
  # with `docker compose up` and does not touch the four long-running services.
  # Builds the Dockerfile `tests` stage (pytest + tests/ on top of runtime deps);
  # the production images stay lean. The suite is hermetic — tests/conftest.py
  # supplies APP_ENV=test defaults and mocks the network — so no env_file, no
  # cloud creds, and no dependency on Supabase/Redis are needed to run it.
  backend_tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: tests
    image: watchman_backend_tests
    container_name: watchman_backend_tests
    profiles: ["test"]
    command: ["python", "-m", "pytest", "-q"]
    restart: "no"
